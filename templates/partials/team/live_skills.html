{% if live_enabled %}
<!-- LIVE SKILLS (filled by static/js/team.js; removed if there is no live data) -->
<section id="skills-panel" class="skills-panel fade-in-section" data-live-url="{{ url_for('team_live_data', team_number=team.team_number) }}"
    aria-live="polite" aria-busy="true" hidden>
    <div class="skills-inner">
        <h2 class="ripple">World Skills Standing</h2>
        <div class="skills-grid">
            <div class="skills-tile skills-tile-primary">
                <span class="skills-label">Combined</span>
                <span class="skills-value" data-field="combined">—</span>
            </div>
            <div class="skills-tile">
                <span class="skills-label">Driver</span>
                <span class="skills-value" data-field="driver">—</span>
            </div>
            <div class="skills-tile">
                <span class="skills-label">Programming</span>
                <span class="skills-value" data-field="programming">—</span>
            </div>
            <div class="skills-tile">
                <span class="skills-label">World Rank</span>
                <span class="skills-value" data-field="rank">—</span>
                <span class="skills-trend" data-field="trend"></span>
            </div>
        </div>
        <p class="skills-meta">
            <span data-field="updated"></span>
            <a class="skills-profile" data-field="profile" href="#" target="_blank" rel="noopener">View on RobotEvents</a>
        </p>
    </div>
</section>
{% endif %}
