<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 — Something Went Wrong | Mepham Robotics</title>
    <link href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='assets/icons/mephamrobotics.png') }}?v=1">
</head>

<body>
    <div class="error-page">
        <div class="error-content">
            <i data-lucide="settings" class="error-emoji"></i>
            <div class="error-code">500</div>
            <p class="error-message">Something Slipped a Gear</p>
            <p class="error-submessage">We hit a snag on our end — our team's already been notified. Please try
                again in a few minutes.</p>
            <div class="error-actions">
                <a href="{{ url_for('index') }}" class="cta-button cta-primary">Go Home</a>
                <a href="{{ url_for('contact') }}" class="cta-button cta-secondary">Contact Us</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"
        integrity="sha384-hJnF5AwidE18GSWTAGHv3ByzzvfNZ1Tcx5y1UUV3WkauuMCEzBJBMSwSt/PUPXnM"
        crossorigin="anonymous"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>

</html>
