{#- Shown to editors and admins on a page visitors currently see as "Under construction". -#}
{% if page_under_construction() %}
<div class="draft-preview" role="status">
    <i data-lucide="construction" aria-hidden="true"></i>
    <span><strong>Under construction.</strong> Visitors see the construction notice instead of this page.</span>
    {% if session.get('role') == 'admin' %}<a href="{{ url_for('admin_site') }}">Site settings</a>{% endif %}
</div>
{% endif %}
