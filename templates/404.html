<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | Mepham Robotics</title>
    <link href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='assets/icons/favicon-32.png') }}">
</head>

<body>
    <div class="error-page">
        <div class="error-content">
            <i data-lucide="bot" class="error-emoji" aria-hidden="true"></i>
            <div class="error-code">404</div>
            <h1 class="error-message">Robot Lost in the Field!</h1>
            <p class="error-submessage">The page you're looking for has either been moved, deleted, or never existed —
                kind of like our first autonomous routine.</p>
            <div class="error-actions">
                <a href="{{ url_for('index') }}" class="cta-button cta-primary">Go Home</a>
                <a href="{{ url_for('contact') }}" class="cta-button cta-secondary">Contact Us</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"
        integrity="sha384-hJnF5AwidE18GSWTAGHv3ByzzvfNZ1Tcx5y1UUV3WkauuMCEzBJBMSwSt/PUPXnM"
        crossorigin="anonymous" defer></script>
    <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
</body>

</html>
