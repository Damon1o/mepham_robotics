name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The suite runs against mongomock, so no database or secrets are needed.
      - name: Run tests
        run: python -m pytest -q

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: for f in static/js/*.js; do node --check "$f"; done

  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          npm install --no-save --no-package-lock playwright@1.53.0 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium

      # Sample content on an in-memory database; no secrets or outside services.
      - name: Start the site
        run: |
          python scripts/a11y_server.py 5099 &
          for i in $(seq 30); do curl -sf -o /dev/null http://127.0.0.1:5099/ && break; sleep 1; done

      - name: Check accessibility (axe, light and dark)
        run: node scripts/a11y.mjs http://127.0.0.1:5099
