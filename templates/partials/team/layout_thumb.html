{% macro layout_thumb(key) -%}
<span class="layout-thumb layout-thumb--{{ key }}" aria-hidden="true">

    <i class="lt-hero"></i><i class="lt-stats"></i><i class="lt-awards"></i><i></i><i class="lt-cards"></i><i></i><i></i>
    {%- endif -%}
</span>
{%- endmacro %}
